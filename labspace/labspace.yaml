    contentPath: 01-introduction.md
  - title: "Pre-flight: install sbx & confirm the toolchain"
    contentPath: 02-preflight.md
  - title: "Lab 1 - Anatomy of a Kit v3"
    contentPath: 03-anatomy.md
    duration: 15
  - title: "Lab 2 - Get a Box token & stage the client"
    contentPath: 04-token-and-client.md
    duration: 10
  - title: "Lab 3 - Validate & build the kit"
    contentPath: 05-validate-build.md
    duration: 10
  - title: "Lab 4 - Run it: compose the mixin onto a workload"
    contentPath: 06-compose.md
    duration: 10
  - title: "Lab 5 - Use Box Mount: two-way sync"
    contentPath: 07-two-way-sync.md
    duration: 10
  - title: "Lab 6 - Verify the security model 🔥"
    contentPath: 08-security-model.md
    duration: 8
  - title: "Lab 7 - Conformance-check with kit-tck"
    contentPath: 09-conformance.md
    duration: 7
  - title: "Lab 8 - Publish the kit"
    contentPath: 10-publish.md
    duration: 5
  - title: "Lab 9 - Clean up kit images (the right way)"
    contentPath: 11-cleanup.md
    duration: 8
  - title: Conclusion & Next Steps
    contentPath: 12-conclusion.md

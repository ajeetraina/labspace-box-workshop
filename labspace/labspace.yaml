metadata:
  id: ajeetraina/labspace-box-workshop
  sourceRepo: github.com/ajeetraina/labspace-box-workshop
  contentVersion: v1.0.0

title: "Build a Docker Sandboxes Kit: The Box Mount Kit"
description: |
  A 90-minute, hands-on workshop. Build, run, verify, and publish a Kit v3
  mixin that brings Box's Box Mount client into a Docker Sandbox - mounting a
  Box folder into an isolated microVM and keeping it in two-way sync, with the
  Box token injected by the sandbox proxy so the real token never enters the
  container. Runs locally: sbx executes on your own host (Apple Silicon or
  Windows 11 x86_64); this Labspace serves the guide and the terminal.

# Two HOST terminals (ttyd on :8085, owned by start-labspace.sh). sbx must run
# on the host because it uses real microVMs and does NOT emulate.
services:
  - id: term1
    title: Terminal 1
    url: http://localhost:8085
    icon: terminal
  - id: term2
    title: Terminal 2
    url: http://localhost:8085
    icon: terminal

sections:
